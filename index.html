<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

</head>

<body>
    <div class="mainCard">
        <table>
            <tr>
                <td>
                    <div class="LogoCard">
                        <img class="logo" src="images/logo.png" alt="logo">
                        <h3 class="headline">Weather app</h3>
                        <p class="txts">Check weather anywhere</p>
                    </div>
                </td>

                <td>
                    <div class="detailsCard">
                        <div>
                            <input id="txtLocation" class="inputtext" type="text" placeholder="Enter your Location">

                            <button class="btnSearch" onclick="btnSearch()">Search</button>

                            <img class="mapSymbol" onclick="btnMap()" src="images/mapSymbol.png" alt="Map">
                        </div>

                        <div id="map"></div>

                        <div id="lblData" class="DateTime"></div>

                        <div id="lblFullWeather" class="miniDetailsCad"></div>
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>

</body>

</html>
